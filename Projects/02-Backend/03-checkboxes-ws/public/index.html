<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million CheckBoxes</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(148, 163, 255, 0.28),
            transparent 30rem
          ),
          linear-gradient(135deg, #111827 0%, #312e81 48%, #1e1b4b 100%);
        color: #cda453;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.15rem, 2.5vw, 1.6rem);
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
        color: #f5f3ff;
        text-shadow: 0 4px 24px rgba(196, 181, 253, 0.25);
      }

      #toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10;
        display: flex;
        width: min(360px, calc(100vw - 32px));
        flex-direction: column;
        gap: 12px;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px solid rgba(254, 202, 202, 0.65);
        border-radius: 16px;
        background: linear-gradient(110deg, #fb7185, #ef4444);
        color: #fff;
        box-shadow: 0 12px 30px rgba(69, 10, 35, 0.3);
        animation: toast-enter 180ms ease-out;
      }

      .toast-icon {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        font-size: 20px;
        font-weight: 700;
      }

      .toast-message {
        flex: 1;
        font-size: 1rem;
        font-weight: 650;
      }

      .toast-close {
        padding: 4px;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 1.25rem;
        line-height: 1;
        opacity: 0.9;
      }

      .toast-close:hover {
        opacity: 1;
      }

      .toast-close:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
        border-radius: 4px;
      }

      @keyframes toast-enter {
        from {
          transform: translateX(16px);
          opacity: 0;
        }

        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      #container {
        width: min(100%, 980px);
        padding: 28px;
        display: grid;
        grid-template-columns: repeat(auto-fill, 24px);
        justify-content: center;
        gap: 12px 14px;
        border: 1px solid rgba(216, 180, 254, 0.22);
        border-radius: 30px;
        background: linear-gradient(
          135deg,
          rgba(129, 140, 248, 0.28),
          rgba(232, 121, 249, 0.14)
        );
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(16px);
      }

      #container input[type="checkbox"] {
        appearance: none;
        position: relative;
        width: 34px;
        height: 34px;
        margin: -5px;
        cursor: pointer;
        border: 1.5px solid rgba(255, 255, 255, 0.58);
        border-radius: 9px;
        background: rgba(224, 231, 255, 0.09);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 4px 12px rgba(49, 46, 129, 0.12);
        transition:
          transform 120ms ease,
          background 120ms ease,
          box-shadow 120ms ease;
      }

      #container input[type="checkbox"]::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 10px;
        height: 18px;
        border: solid #312e81;
        border-width: 0 3px 3px 0;
        transform: translateY(-2px) rotate(45deg) scale(0);
        transition: transform 120ms ease;
      }

      #container input[type="checkbox"]:checked::before {
        transform: translateY(-2px) rotate(45deg) scale(1);
      }

      #container input[type="checkbox"]:hover {
        transform: scale(1.08);
        background: rgba(224, 231, 255, 0.18);
        box-shadow: 0 6px 18px rgba(196, 181, 253, 0.22);
      }

      #container input[type="checkbox"]:checked {
        border-color: rgba(255, 255, 255, 0.9);
        background: linear-gradient(
          135deg,
          rgba(165, 180, 252, 0.95),
          rgba(216, 180, 254, 0.95)
        );
        box-shadow:
          inset 0 1px 2px rgba(255, 255, 255, 0.35),
          0 5px 16px rgba(196, 181, 253, 0.35);
      }

      #container input[type="checkbox"]:focus-visible {
        outline: 2px solid #ede9fe;
        outline-offset: 3px;
        border-radius: 9px;
      }

      @media (max-width: 600px) {
        body {
          padding: 32px 16px;
          gap: 18px;
        }

        #toast-container {
          top: 16px;
          right: 16px;
        }

        #container {
          padding: 20px;
          gap: 10px 12px;
          border-radius: 20px;
        }

        #container input[type="checkbox"] {
          width: 30px;
          height: 30px;
          margin: -3px;
        }

        #container input[type="checkbox"]::before {
          width: 8px;
          height: 15px;
        }
      }
    </style>
  </head>
  <body>
    <h1>CheckBoxes</h1>
    <h4>A tiny playground of clickable squares.Tick away!!</h4>
    <div id="toast-container" aria-live="assertive" aria-atomic="false"></div>
    <div id="container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const container = document.getElementById("container");
      const toastContainer = document.getElementById("toast-container");
      const CHECKBOX_COUNT = 100;

      socket.on("server:error", (data) => {
        const errorMessage = data.error;
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.setAttribute("role", "alert");

        const icon = document.createElement("span");
        icon.className = "toast-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "!";

        const message = document.createElement("span");
        message.className = "toast-message";
        message.textContent = errorMessage;

        const closeButton = document.createElement("button");
        closeButton.className = "toast-close";
        closeButton.type = "button";
        closeButton.setAttribute("aria-label", "Dismiss error");
        closeButton.textContent = "×";
        closeButton.addEventListener("click", () => toast.remove());

        toast.append(icon, message, closeButton);
        toastContainer.appendChild(toast);
        window.setTimeout(() => toast.remove(), 5000);
      });

      socket.on("server:checkbox:change", (data) => {
        console.log(`Socket Server Event`, data);
        const { index, checked } = data;

        const input = document.getElementById(`checkbox-${index}`);
        if (input) {
          input.checked = checked;
        }
      });

      async function fetchStateFromServer() {
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        const response = await fetch("/checkboxes", { method: "GET" });
        const data = await response.json();
        if (data && data.checkboxes) {
          data.checkboxes.forEach((serverValue, index) => {
            const input = document.createElement("input");

            input.type = "checkbox";
            input.id = `checkbox-${index}`;
            input.checked = serverValue;

            input.addEventListener("change", (event) => {
              const checked = event.target.checked;
              console.log("Checkbox Changed", { index, checked });
              socket.emit("client:checkbox:change", { index, checked });
              fetchStateFromServer();
            });
            container.appendChild(input);
          });
        }
      }

      window.addEventListener("load", async () => {
        fetchStateFromServer();
      });
    </script>
  </body>
</html>
