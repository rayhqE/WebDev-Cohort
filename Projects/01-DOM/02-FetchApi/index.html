<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #2c3456, #2e5a31);
        color: #333;
      }

      .container {
        width: min(90%, 500px);
        padding: 30px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin-top: 0;
        text-align: center;
      }

      .input-area {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #5369d6;
      }

      ul {
        padding: 0;
        margin-top: 25px;
        list-style: none;
      }

      li {
        margin-bottom: 10px;
        padding: 12px 15px;
        background: #f1f3f5;
        border-radius: 8px;
        cursor: pointer;
      }

      li:hover {
        background: #ffe0e0;
        text-decoration: line-through;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <h1>Explore your Api!</h1>

      <div class="input-area">
        <input type="text" placeholder="Enter your api here!" id="input" />
        <button id="btn">Get Data!</button>
      </div>

      <ul id="listHolder"></ul>
    </main>

    <script>
      const buttonRef = document.getElementById("btn");
      const inputRef = document.getElementById("input");
      const listHolder = document.getElementById("listHolder");

      let api = async () => {
        const endpoint = inputRef.value;

        try {
          // https://api.freeapi.app/api/v1/public/quotes?page=1&limit=10&query=human
          const response = await fetch(endpoint);
          const data = await response.json();
          for (const obj of data.data.data) {
            let newLi = document.createElement("li");
            newLi.textContent = obj.content;
            newLi.addEventListener("click", () => {
              newLi.remove();
            });
            listHolder.appendChild(newLi);
            // listHolder.innerHTML = "";
            inputRef.value = "";
          }
        } catch (error) {
          console.error("Something went wrong:", error.message);
        }
      };
      buttonRef.addEventListener("click", api);
    </script>
  </body>
</html>
